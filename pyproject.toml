[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-analyst-agent"
version = "0.1.0"
description = "A tool-using LLM agent that answers natural-language questions over a SQL database, with guardrails and an eval harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sql-agent = "sql_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_agent"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
